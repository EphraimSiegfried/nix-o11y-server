name: "Daily Update and Deploy"

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update Flake
        run: nix flake update

      - name: Update Caddy plugin hash
        run: |
          HASH=$(nix build '.#nixosConfigurations.o11y.config.services.caddy.package' 2>&1 | grep -oP 'got:\s+\Ksha256-\S+' || true)
          if [ -n "$HASH" ]; then
            echo -n "$HASH" > modules/services/caddy-plugins-hash
            echo "Updated caddy plugin hash to $HASH"
          else
            echo "Caddy plugin hash remains unchanged"
          fi

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          config: |
            Host o11y
              HostName ${{ secrets.SERVER_ADDRESS }}
              Port 2001
              User root

      - name: Deploy configuration
        run: nix run github:serokell/deploy-rs -- .#o11y --remote-build

      - name: Commit and Push flake.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "flake update"
          file_pattern: flake.lock modules/services/caddy-plugins-hash

